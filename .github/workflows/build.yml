name: Build

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - name: Determine whether this is a release tag push
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag && "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: windows-x64
          - runner: ubuntu-22.04
            asset: linux-x64
          - runner: macos-15-intel
            asset: macos-x64
          - runner: macos-14
            asset: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set application version from release tag
        if: needs.classify.outputs.publish == 'true'
        run: node scripts/set-release-version.mjs "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev libgtk-3-0 libnss3 libasound2 libgbm1 xvfb
      - run: npm ci
      - name: Rust tests
        run: cargo test --locked --manifest-path native/Cargo.toml --workspace --exclude probe-rs
      - name: Build Rust core
        run: npm run build:native
      - name: Node tests (includes end-to-end mock adapter session)
        run: npm test
      - name: UI smoke test
        env:
          CI: '1'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then RUN="xvfb-run -a"; fi
          $RUN node scripts/smoke.mjs scripts/smoke/streaming.js smoke-streaming.png
          $RUN node scripts/smoke.mjs scripts/smoke/debugging.js smoke-debugging.png
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never
      - name: Collect platform-specific release files
        shell: bash
        env:
          ASSET_PLATFORM: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "$ASSET_PLATFORM" in
            windows-x64) patterns=('*.exe' '*.zip') ;;
            linux-x64) patterns=('*.AppImage' '*.tar.gz') ;;
            macos-x64|macos-arm64) patterns=('*.dmg') ;;
            *) echo "Unknown platform: $ASSET_PLATFORM" >&2; exit 1 ;;
          esac
          mkdir -p release
          for pattern in "${patterns[@]}"; do
            matches=(dist/$pattern)
            if (( ${#matches[@]} == 0 )); then
              echo "Missing $ASSET_PLATFORM package: $pattern" >&2
              exit 1
            fi
            for file in "${matches[@]}"; do
              name=$(basename "$file")
              safe_name=$(printf '%s' "$name" | LC_ALL=C sed 's/[^A-Za-z0-9._-]/-/g')
              destination="release/${ASSET_PLATFORM}-${safe_name}"
              if [[ -e "$destination" ]]; then
                echo "Package filename collision after normalization: $name" >&2
                exit 1
              fi
              cp "$file" "$destination"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-studio-${{ matrix.asset }}
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.asset }}
          path: |
            smoke-*.png
          if-no-files-found: ignore

  publish:
    needs: [classify, build]
    if: needs.classify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: embedded-studio-*
          path: artifacts
      - name: Verify all packages and publish release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for platform in windows-x64 linux-x64 macos-x64 macos-arm64; do
            files=("artifacts/embedded-studio-$platform"/*)
            if (( ${#files[@]} == 0 )); then
              echo "Missing $platform artifact" >&2
              exit 1
            fi
          done
          require_package() {
            local directory="$1" pattern="$2"
            local -a matches=("$directory"/$pattern)
            if (( ${#matches[@]} == 0 )); then
              echo "Missing package $pattern in $directory" >&2
              exit 1
            fi
          }
          require_package artifacts/embedded-studio-windows-x64 '*.exe'
          require_package artifacts/embedded-studio-windows-x64 '*.zip'
          require_package artifacts/embedded-studio-linux-x64 '*.AppImage'
          require_package artifacts/embedded-studio-linux-x64 '*.tar.gz'
          require_package artifacts/embedded-studio-macos-x64 '*.dmg'
          require_package artifacts/embedded-studio-macos-arm64 '*.dmg'
          mkdir -p release
          for file in artifacts/embedded-studio-*/*; do
            name=$(basename "$file")
            if [[ -e "release/$name" ]]; then
              echo "Duplicate release filename: $name" >&2
              exit 1
            fi
            cp -- "$file" "release/$name"
          done
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --title "Embedded Studio $RELEASE_TAG" --generate-notes --verify-tag
          fi
          gh release view "$RELEASE_TAG" --json url,assets
